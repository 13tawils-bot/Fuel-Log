<script>
(function () {
  const N = window.Nutrition;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => N.iso(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---------- State and storage ----------
  // Saved to your Claude account when this runs as a Claude artifact, otherwise to this browser.
  const S = { profile: null, weights: {}, foods: {}, days: {}, meals: {}, health: {}, workouts: {}, routines: {}, exercises: {}, photos: {}, measures: {}, active: null };
  const COMMON = window.COMMON_FOODS || [];
  const inClaude = !!(window.claude && window.claude.use);
  // The demo page loads example data and never touches your real log.
  const DEMO = window.FUEL_DEMO || null;
  const LOCAL = DEMO ? "fuel-log-demo" : "fuel-log-v1";
  let mode = "local", refs = null, sample = null, imagesOk = false, assets = null;
  let booting = !DEMO && !!(window.claude && window.claude.use); // wait for saved data before showing setup
  // Claude artifacts can't open the camera; the installed app can.
  const liveScanOk = !(window.claude && window.claude.use) && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!window.ZXing;
  const installed = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  const queues = {};

  function loadLocal() {
    if (DEMO) { Object.assign(S, JSON.parse(JSON.stringify(DEMO))); return; }
    try { Object.assign(S, JSON.parse(localStorage.getItem(LOCAL) || "{}")); } catch (e) {}
    for (const k of ["meals", "health", "workouts", "routines", "exercises", "photos", "measures"]) S[k] = S[k] || {};
    // The workout in progress is also kept on its own, so a crash or reload never loses sets.
    try { const a = JSON.parse(localStorage.getItem(LOCAL + "-active") || "null"); if (a) S.active = a; } catch (e) {}
  }
  function saveLocal() {
    try { const { active, ...rest } = S; localStorage.setItem(LOCAL, JSON.stringify(rest)); }
    catch (e) { flash("This device is out of storage space for Fuel Log. Copy a backup from the Plan tab."); }
  }
  function write(ref, data) {
    const k = ref.path;
    queues[k] = (queues[k] || Promise.resolve()).then(() => (data ? ref.set(data) : ref.delete())).catch((e) => {
      if (e && e.code === "quota_exceeded") flash("Storage is full. Delete some old foods to keep saving.");
      else if (e && e.code === "unavailable") return new Promise((r) => setTimeout(r, 800 + Math.random() * 800)).then(() => (data ? ref.set(data) : ref.delete()));
    });
  }
  const store = {
    profile(p) { S.profile = p; if (mode === "db") write(refs.profile, p); else saveLocal(); },
    weight(date, kg) {
      if (kg == null) delete S.weights[date]; else S.weights[date] = kg;
      if (mode === "db") write(refs.weights.doc(date), kg == null ? null : { date, kg }); else saveLocal();
    },
    food(f) { S.foods[f.id] = f; if (mode === "db") write(refs.foods.doc(f.id), f); else saveLocal(); },
    dropFood(id) { delete S.foods[id]; if (mode === "db") write(refs.foods.doc(id), null); else saveLocal(); },
    day(date, day) {
      const keep = day.entries.length || day.sent;
      if (!keep) delete S.days[date]; else S.days[date] = day;
      if (mode === "db") write(refs.days.doc(date), keep ? { date, entries: day.entries, ...(day.sent ? { sent: day.sent } : {}) } : null); else saveLocal();
    },
    meal(m) { S.meals[m.id] = m; if (mode === "db") write(refs.meals.doc(m.id), m); else saveLocal(); },
    dropMeal(id) { delete S.meals[id]; if (mode === "db") write(refs.meals.doc(id), null); else saveLocal(); },
    health(date, h) { S.health[date] = h; if (mode === "db") write(refs.health.doc(date), { date, ...h }); else saveLocal(); },
    workout(w) { S.workouts[w.id] = w; if (mode === "db") write(refs.workouts.doc(w.id), w); else saveLocal(); },
    dropWorkout(id) { delete S.workouts[id]; if (mode === "db") write(refs.workouts.doc(id), null); else saveLocal(); },
    routine(r) { S.routines[r.id] = r; if (mode === "db") write(refs.routines.doc(r.id), r); else saveLocal(); },
    dropRoutine(id) { delete S.routines[id]; if (mode === "db") write(refs.routines.doc(id), null); else saveLocal(); },
    exercise(e) { S.exercises[e.id] = e; if (mode === "db") write(refs.exercises.doc(e.id), e); else saveLocal(); },
    photo(p) { S.photos[p.id] = p; if (mode === "db") write(refs.photos.doc(p.id), p); else saveLocal(); },
    measure(date, m) { if (m) S.measures[date] = m; else delete S.measures[date]; if (mode === "db") write(refs.measures.doc(date), m ? { date, ...m } : null); else saveLocal(); },
    dropPhoto(id) { delete S.photos[id]; if (mode === "db") write(refs.photos.doc(id), null); else saveLocal(); },
    active(a) {
      S.active = a;
      try { if (a) localStorage.setItem(LOCAL + "-active", JSON.stringify(a)); else localStorage.removeItem(LOCAL + "-active"); } catch (e) {}
      if (mode === "db") write(refs.active, a ? { workout: a } : null);
    },
  };

  async function connect() {
    const C = window.claude;
    if (DEMO || !C || !C.use) { setStore(); return; }
    const [db, user, smp, ast] = await Promise.all([C.use("db"), C.use("user"), C.use("sample"), C.use("assets")]);
    assets = ast;
    if (smp) {
      sample = smp;
      try { imagesOk = !!(await smp.limits()).images; } catch (e) { imagesOk = false; }
    }
    const id = user ? await user.id() : null;
    if (db && id) {
      const base = db.doc("data/users/" + id + "/profile");
      refs = { profile: base, weights: base.collection("weights"), foods: base.collection("foods"), days: base.collection("days"), meals: base.collection("meals"), health: base.collection("health"),
        workouts: base.collection("workouts"), routines: base.collection("routines"), exercises: base.collection("exercises"), photos: base.collection("photos"), measures: base.collection("measures"), active: base.collection("state").doc("active") };
      mode = "db";
      const localActive = S.active;
      S.profile = null; S.weights = {}; S.foods = {}; S.days = {}; S.meals = {}; S.health = {}; S.workouts = {}; S.routines = {}; S.exercises = {}; S.photos = {}; S.measures = {};
      const ready = new Set();
      const got = (k) => { ready.add(k); if (ready.size >= 12) { booting = false; render(); } };
      const fail = (e) => { if (e && e.code !== "unavailable") flash("Lost connection to your saved data. Reload to reconnect."); };
      base.onSnapshot((s) => { S.profile = s.exists ? s.data() : null; got("p"); }, fail);
      refs.weights.onSnapshot((q) => { S.weights = Object.fromEntries(q.docs.map((d) => [d.id, d.data().kg])); got("w"); }, fail);
      refs.foods.onSnapshot((q) => { S.foods = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("f"); }, fail);
      refs.days.orderBy("date", "desc").limit(180).onSnapshot((q) => { S.days = Object.fromEntries(q.docs.map((d) => [d.id, { entries: d.data().entries || [], sent: d.data().sent || null }])); got("d"); }, fail);
      refs.meals.onSnapshot((q) => { S.meals = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("m"); }, fail);
      refs.health.orderBy("date", "desc").limit(120).onSnapshot((q) => { S.health = Object.fromEntries(q.docs.map((d) => { const { date, ...h } = d.data(); return [d.id, h]; })); got("h"); }, fail);
      refs.workouts.orderBy("start", "desc").limit(400).onSnapshot((q) => { S.workouts = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("wo"); }, fail);
      refs.routines.onSnapshot((q) => { S.routines = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("ro"); }, fail);
      refs.exercises.onSnapshot((q) => { S.exercises = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("ex"); }, fail);
      refs.measures.onSnapshot((q) => { S.measures = Object.fromEntries(q.docs.map((d) => { const { date, ...m } = d.data(); return [d.id, m]; })); got("ms"); }, fail);
      refs.photos.onSnapshot((q) => { S.photos = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("ph"); }, fail);
      // The workout in progress is read once; this device's copy wins if it's newer.
      refs.active.get().then((d) => { const remote = d.exists ? d.data().workout : null; S.active = localActive && (!remote || localActive.start >= remote.start) ? localActive : remote; }, () => { S.active = localActive; }).then(() => got("ac"));
      setStore();
      return;
    }
    booting = false;
    setStore();
    render();
  }
  function setStore() {
    $("#store").textContent = DEMO ? "Demo · example data" : mode === "db" ? "Saved to your Claude account" : installed ? "Saved on this phone" : "Saved in this browser";
  }

  // ---------- Units ----------
  const unit = () => (S.profile && S.profile.unit) || "kg";
  const fmtW = (kg, d = 1) => (kg == null ? "–" : unit() === "lb" ? (kg * 2.20462).toFixed(d) : kg.toFixed(d));
  const toKg = (v) => (unit() === "lb" ? v / 2.20462 : v);

  // ---------- Routing ----------
  let tab = "today", viewDate = today(), weightRange = 90, foodQuery = "", coachText = "", coachBusy = false;
  const tabs = ["today", "train", "progress", "me"];
  const ALIAS = { weight: "progress", body: "progress", plan: "me", foods: "me" };
  const hashTab = ALIAS[location.hash.slice(1)] || location.hash.slice(1);
  if (tabs.includes(hashTab)) tab = hashTab;
  let meSub = null;
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    // Tapping the tab you're on takes you back to its main screen.
    if (tab === b.dataset.tab) { T.reset(); meSub = null; }
    else if (T.inExercise()) T.reset();
    tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  }));

  function flash(msg, kind = "warn") {
    const el = document.createElement("div");
    el.className = "status " + kind; el.setAttribute("role", "status"); el.textContent = msg;
    $("#view").prepend(el); setTimeout(() => el.remove(), 6000);
  }

  function currentTargets() {
    return S.profile ? N.targets(S.profile, S.weights, S.days, today()) : null;
  }

  function render() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    const t = currentTargets();
    $("#page-title").textContent = tab === "me" && meSub ? ME_PAGES[meSub][0] : { today: "Today", train: "Workout", progress: "Progress", me: "Me" }[tab];
    $("#goal-line").textContent = S.profile ? `${N.GOALS[S.profile.goal].label} · ${t.kcal} kcal · ${t.p}g protein` : "Weight, food and what to eat next";
    const v = $("#view");
    if (booting) { v.innerHTML = `<div class="card"><p class="empty" style="margin:0">Loading your log…</p></div>`; return; }
    if (!S.profile) { v.innerHTML = setupCard(); bindSetup(); return; }
    const banner = (DEMO ? `<div class="status" role="note">This is a demo filled with four weeks of example data. Tap around freely; nothing is saved, and reloading resets it.</div>` : "") + (tab !== "train" ? T.banner() : "");
    if (tab === "today") v.innerHTML = banner + todayView(t);
    else if (tab === "train") v.innerHTML = (DEMO ? banner : "") + T.view();
    else if (tab === "progress") v.innerHTML = banner + (T.inExercise() ? T.progressView() : recompCard() + weightView(t) + T.progressView(T.photosCard()));
    else v.innerHTML = banner + meView(t);
    bind[tab] && bind[tab](t);
    T.bindBanner();
  }

  // ---------- Setup / profile ----------
  const DEFAULT_PROFILE = { goal: "lose", ratePct: 0.5, sex: "male", age: 30, heightCm: 178, startWeight: 82, activity: "moderate", unit: "kg" };
  function profileForm(p, submitLabel) {
    const seg = (name, opts, val) => `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(val) === String(v)}">${l}</button>`).join("")}</div>`;
    const kgWk = (pct) => { const kg = (p.startWeight || 80) * pct / 100; return p.unit === "lb" ? `${(kg * 2.20462).toFixed(1)} lb` : `${kg.toFixed(1)} kg`; };
    const rates = p.goal === "recomp" ? [[0.25, `Slow · ${kgWk(0.25)}/wk`], [0.5, `Steady · ${kgWk(0.5)}/wk`]] : p.goal === "gain" ? [[0.25, `Steady · ${kgWk(0.25)}/wk`], [0.5, `Faster · ${kgWk(0.5)}/wk`]] : [[0.25, `Gentle · ${kgWk(0.25)}/wk`], [0.5, `Steady · ${kgWk(0.5)}/wk`], [0.75, `Faster · ${kgWk(0.75)}/wk`]];
    return `<form id="pf" class="card">
      <div class="grid2" style="grid-template-columns:minmax(0,1fr)">
        <label class="field"><span>Goal</span>${seg("goal", [["lose", "Lose fat"], ["gain", "Build muscle"], ["recomp", "Lose fat & build muscle"], ["maintain", "Maintain"]], p.goal)}</label>
        ${p.goal === "recomp" ? `<p class="muted small" style="margin:-4px 0 0">A small deficit with extra protein. Your weight will move slowly, so Fuel Log judges progress by your waist and your lifts. Works best if you're fairly new to lifting or coming back to it.</p>` : ""}
        ${p.goal !== "maintain" ? `<label class="field"><span>How fast?</span>${seg("ratePct", rates, p.ratePct)}</label>` : ""}
      </div>
      <div class="grid3">
        <label class="field"><span>Weight (${p.unit || "kg"})</span><input id="pf-weight" type="number" step="0.1" inputmode="decimal" value="${p.unit === "lb" ? (p.startWeight * 2.20462).toFixed(1) : p.startWeight}"></label>
        <label class="field"><span>Height (cm)</span><input id="pf-height" type="number" inputmode="numeric" value="${p.heightCm}"></label>
        <label class="field"><span>Age</span><input id="pf-age" type="number" inputmode="numeric" value="${p.age}"></label>
      </div>
      <label class="field"><span>Sex (for the calorie maths)</span>${seg("sex", [["male", "Male"], ["female", "Female"]], p.sex)}</label>
      <label class="field"><span>How many days a week do you work out?</span>${seg("activity", [["sedentary", "0–1"], ["light", "2–3"], ["moderate", "4–5"], ["very", "6+"]], p.activity)}</label>
      <label class="field"><span>Units</span>${seg("unit", [["kg", "kg"], ["lb", "lb"]], p.unit || "kg")}</label>
      <button class="btn wide" type="submit">${submitLabel}</button>
    </form>`;
  }
  let draft = null;
  function bindProfile(after) {
    const f = $("#pf");
    f.querySelectorAll("[data-seg]").forEach((g) => g.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      readDraft();
      const k = g.dataset.seg; let val = b.dataset.v;
      if (k === "ratePct") val = Number(val);
      if (k === "unit" && val !== draft.unit) { draft.unit = val; }
      draft[k] = val;
      if (k === "goal") draft.ratePct = val === "gain" || val === "recomp" ? 0.25 : 0.5;
      render();
    }));
    f.addEventListener("submit", (e) => {
      e.preventDefault(); readDraft();
      const first = !S.profile, latest = N.latestWeight(S.weights);
      const next = { ...draft, kcal: null };
      next.kcal = N.targets(next, { ...S.weights, [today()]: draft.startWeight }, S.days, today()).recommended;
      store.profile(next);
      // Record a weigh-in only when the weight was actually entered or changed here.
      if (first || latest == null || Math.abs(draft.startWeight - latest) >= 0.05) store.weight(today(), draft.startWeight);
      draft = null; after && after(); render();
      if (!first) flash("Details saved.", "good");
    });
  }
  function readDraft() {
    const w = Number($("#pf-weight").value), u = draft.unit || "kg";
    if (w) draft.startWeight = Math.round((u === "lb" ? w / 2.20462 : w) * 10) / 10;
    draft.heightCm = Number($("#pf-height").value) || draft.heightCm;
    draft.age = Number($("#pf-age").value) || draft.age;
  }
  function setupCard() {
    draft = draft || { ...DEFAULT_PROFILE };
    return `<div class="card"><h2>Let's set you up</h2><p class="muted small" style="margin:0">Pick your goal and pop in your numbers (the ones shown are examples). Fuel Log works out your calories and protein, and fine-tunes them as you go.</p></div>` + profileForm(draft, "Start");
  }
  function bindSetup() { bindProfile(); }

  // ---------- Today ----------
  function macroRow(label, color, eaten, target, unitLabel = "g") {
    const pct = target ? Math.min(100, (eaten / target) * 100) : 0;
    return `<div class="macro"><span class="name"><i style="background:${color}"></i>${label}</span>
      <div class="track" role="img" aria-label="${label} ${eaten} of ${target}${unitLabel}"><b style="width:${pct}%;background:${color}"></b></div>
      <span class="val"><strong>${Math.round(eaten)}</strong> / ${target}${unitLabel}</span></div>`;
  }
  let lastSuggestions = [], lastPlans = [], planOpen = false, savingMeal = null;
  const stepGoal = () => (S.profile && S.profile.stepGoal) || 8000;
  function winsFor(d, t) {
    return N.dayWins({ day: S.days[d], target: t, goal: S.profile.goal, trained: T.trainedOn(d) || (d === today() && !!S.active),
      steps: S.health[d] ? S.health[d].steps : null, stepGoal: stepGoal() });
  }
  function todayView(t) {
    const day = S.days[viewDate] || { entries: [] };
    const tot = N.totals(day.entries);
    const left = t.kcal - tot.kcal;
    const isToday = viewDate === today();
    const dateText = new Date(viewDate + "T12:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    const label = viewDate === N.addDays(today(), -1) ? "Yesterday" : dateText;

    // Meals: show what's logged; empty meals collapse into one row of "Add" buttons.
    const logged = N.MEALS.filter((m) => day.entries.some((e) => e.meal === m));
    const mealCards = logged.map((m) => {
      const es = day.entries.map((e, i) => ({ e, i })).filter(({ e }) => e.meal === m);
      const mt = N.totals(es.map((x) => x.e));
      const actions = savingMeal === m
        ? `<form class="meal-actions" data-savemeal="${m}"><input type="text" id="meal-name" value="My ${m}" aria-label="Meal name" style="width:9.5rem;padding:6px 8px"><button class="btn small" type="submit">Save</button></form>`
        : `<div class="meal-actions"><span class="small muted num">${mt.kcal} kcal</span><button class="link small" type="button" data-addmeal="${m}">+ Add</button><button class="link small" type="button" data-savem="${m}" aria-label="Save ${m} as a meal">Save</button></div>`;
      return `<div class="meal"><div class="meal-head"><h3>${m}</h3>${actions}</div>
        ${es.map(({ e, i }) => `<div class="entry"><div><div class="nm">${esc(e.name)}</div><div class="sub">${e.grams}g · ${e.p}g protein</div></div><span class="num small">${e.kcal}</span><button class="x" type="button" data-del="${i}" aria-label="Remove ${esc(e.name)}">×</button></div>`).join("")}
      </div>`;
    }).join("");
    const missing = N.MEALS.filter((m) => !logged.includes(m));
    const yest = S.days[N.addDays(viewDate, -1)]?.entries || [];
    const addRow = missing.length ? `<div class="add-meals">${missing.map((m) => `<button type="button" class="chip-btn" data-addmeal="${m}">+ ${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}
      ${missing.filter((m) => yest.some((e) => e.meal === m)).slice(0, 2).map((m) => `<button type="button" class="chip-btn ghost" data-copy="${m}">Same ${m} as yesterday</button>`).join("")}</div>` : "";

    // Food ideas: only when there's something to suggest.
    let sugg = "";
    if (isToday) {
      const meal = N.mealForHour(new Date().getHours());
      const s = N.suggest({ foods: S.foods, days: S.days, today: viewDate, target: t, goal: S.profile.goal, meal });
      lastSuggestions = s.items;
      if (!s.note && s.items.length) {
        let plansHtml = "";
        if (planOpen) {
          const pr = N.planRest({ foods: S.foods, days: S.days, today: viewDate, target: t, goal: S.profile.goal, meal });
          lastPlans = pr.plans;
          plansHtml = pr.plans.length ? pr.plans.map((pl, i) => `<div class="plan"><div class="row spread"><strong class="num">${pl.kcal} kcal · ${pl.p}g protein</strong><button class="btn small" type="button" data-plan="${i}">Log all</button></div>
            <ul>${pl.items.map((it) => `<li>${esc(it.food.name)} <span class="pill">${it.grams}g</span></li>`).join("")}</ul></div>`).join("")
            : `<p class="empty">Not enough left today to plan a full meal.</p>`;
        }
        sugg = `<section class="card"><div class="row spread"><h2>Food ideas</h2><span class="small muted">${Math.max(0, Math.round(s.remaining.p))}g protein to go</span></div>
          ${s.items.slice(0, 3).map((it, i) => `<div class="sugg"><div><div>${esc(it.food.name)} <span class="pill">${it.grams}g</span></div>
            <div class="why">${it.n.kcal} kcal · ${it.n.p}g protein${it.why.length ? " · " + esc(it.why.join(", ")) : ""}</div></div>
            <button class="btn small" type="button" data-sugg="${i}">Add</button></div>`).join("")}
          ${Object.keys(S.foods).length >= 2 ? `<button class="link" type="button" id="plan-toggle" style="justify-self:start">${planOpen ? "Hide meal plans" : "Plan the rest of today for me"}</button>${plansHtml}` : ""}</section>`;
      }
    }

    // Wins strip and macros, folded into one summary card.
    const w = winsFor(viewDate, t) || { protein: false, calories: false, moved: false, score: 0 };
    const steps = S.health[viewDate]?.steps;
    const st = N.weekStreak((d) => winsFor(d, t), today());
    const DAYS = ["M", "T", "W", "T", "F", "S", "S"];
    const dots = st.week.map((d, i) => { const r = d.wins; const cls = d.future ? "future" : !r ? "none" : r.score === 3 ? "great" : r.good ? "good" : "miss";
      return `<div class="wd ${cls} ${d.date === today() ? "today" : ""}"><i></i><span>${DAYS[i]}</span></div>`; }).join("");
    const chip = (ok, txt) => `<span class="wchip ${ok ? "on" : ""}"><i aria-hidden="true">${ok ? "✓" : ""}</i>${txt}</span>`;
    const h = S.health[viewDate];
    const sentAll = day.sent && ["kcal", "p", "c", "f"].every((k) => (day.sent[k] || 0) >= tot[k] - 0.5);
    const due = isToday && N.checkInDue(S.profile, S.days, today());
    return `<div class="app" style="gap:14px">
      ${due ? `<button class="banner" type="button" id="ci-go"><span><strong>Your weekly check-in is ready</strong><br><span class="small">2 minutes: how the week went, and your targets</span></span><span aria-hidden="true">›</span></button>` : ""}
      ${isToday ? nextUpCard(t, day) : ""}
      <section class="card">
        <div class="row spread" style="align-items:flex-end">
          <div class="left"><span class="big ${left < 0 ? "over" : ""}">${Math.abs(left)}</span><span class="muted">kcal ${left < 0 ? "over" : "left"}</span></div>
          <button class="btn" type="button" id="add">+ Add food</button>
        </div>
        ${macroRow("Protein", "var(--protein)", tot.p, t.p)}
        <details class="more"><summary>Carbs, fat and fibre</summary><div class="macros" style="margin-top:10px">
          ${macroRow("Carbs", "var(--carbs)", tot.c, t.c)}${macroRow("Fat", "var(--fat)", tot.f, t.f)}${macroRow("Fibre", "var(--fibre)", tot.fibre, t.fibre)}</div></details>
        <div class="wins-line">
          <div class="wchips">${chip(w.protein, "Protein")}${chip(w.moved, T.trainedOn(viewDate) ? "Trained" : steps != null ? `${(steps / 1000).toFixed(1)}k steps` : "Moved")}${chip(w.calories, "Calories")}</div>
          <span class="small ${w.score >= 2 ? "good-t" : "muted"}">${w.score === 3 ? "Day won" : w.score === 2 ? "Good day" : `${w.score}/3`}</span>
        </div>
        <div class="week">${dots}</div>
        <details class="more"><summary>${st.streak ? `Streak: ${st.streak} week${st.streak > 1 ? "s" : ""}` : `${st.goodThisWeek} of ${st.need} good days this week`}</summary>
          <p class="small muted" style="margin:8px 0 0">A good day is 2 of 3: protein hit, moved (a workout or ${stepGoal().toLocaleString("en-GB")} steps), and calories close to target. Get 5 good days in a week to keep your streak, so a couple of off days never break it.</p></details>
        ${h || isToday ? `<div class="health">${h ? [h.steps != null && `<span><b>${h.steps.toLocaleString("en-GB")}</b> steps</span>`, h.sleepH != null && `<span><b>${Math.floor(h.sleepH)}h ${String(Math.round((h.sleepH % 1) * 60)).padStart(2, "0")}m</b> sleep</span>`].filter(Boolean).join("") : `<span>Steps and sleep</span>`}
          <span style="margin-left:auto" class="row">${isToday ? `<button class="link small" type="button" id="h-import">${h ? "Update" : "Import from Health"}</button>` : ""}${!inClaude && day.entries.length ? `<button class="link small" type="button" id="h-send">${sentAll ? "Sent ✓" : "Send to Health"}</button>` : ""}</span></div>` : ""}
      </section>
      ${sugg}
      <section class="card">
        ${mealCards || `<p class="empty" style="margin:0">${isToday ? "Nothing logged yet today." : "Nothing logged this day."}</p>`}
        ${addRow}
      </section>
      <div class="daynav"><button type="button" id="prev" aria-label="Previous day">‹</button><h2>${isToday ? "Today, " + dateText : label}</h2><button type="button" id="next" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button></div>
    </div>`;
  }

  // "Next up": the one or two things worth doing right now.
  function nextUpCard(t, day) {
    const hour = new Date().getHours(), rows = [];
    lastUsual = null;
    if (S.weights[today()] == null && hour < 14) {
      rows.push(`<form class="nu-row" id="quick-weigh"><span class="nu-ic"><svg viewBox="0 0 24 24"><path d="M5 20h14l-2-12H7zM9 8a3 3 0 0 1 6 0M12 13l2-2"/></svg></span><div class="nu-txt"><strong>Step on the scale</strong><span>First thing, before food</span></div>
        <input id="qw" type="number" step="0.1" inputmode="decimal" placeholder="${fmtW(N.latestWeight(S.weights))}" aria-label="Weight in ${unit()}" style="width:5.2rem;text-align:center"><button class="btn small" type="submit">Save</button></form>`);
    }
    const meal = N.mealForHour(hour);
    if (!day.entries.some((e) => e.meal === meal)) {
      // Your usual: a saved meal for this slot, or the foods you most often have now.
      const saved = Object.values(S.meals).find((m) => m.meal === meal);
      let usual = null;
      if (saved) usual = { label: saved.name, items: saved.items.map((it) => ({ food: S.foods[it.foodId] || (it.per100 && { id: it.foodId, name: it.name, per100: it.per100, brand: "", barcode: "" }), grams: it.grams })).filter((x) => x.food) };
      else {
        // The exact combination you've had for this meal most often (at least twice in 30 days).
        const combos = {};
        for (const d of Object.keys(S.days).filter((d) => d >= N.addDays(today(), -30) && d < today()).sort()) {
          const es = S.days[d].entries.filter((e) => e.meal === meal && S.foods[e.foodId]);
          if (!es.length) continue;
          const key = es.map((e) => e.foodId).sort().join("|");
          combos[key] = { n: (combos[key]?.n || 0) + 1, es };
        }
        const best = Object.values(combos).sort((a, b) => b.n - a.n)[0];
        if (best && best.n >= 2) usual = { label: best.es.map((e) => S.foods[e.foodId].name.replace(/,.*$/, "")).join(" + "), items: best.es.map((e) => ({ food: S.foods[e.foodId], grams: e.grams })) };
      }
      const name = meal === "snacks" ? "a snack" : meal;
      if (usual && usual.items.length) {
        lastUsual = usual.items.map((x) => ({ ...x, meal }));
        const k = usual.items.reduce((a, x) => a + N.portion(x.food, x.grams).kcal, 0);
        rows.push(`<div class="nu-row"><span class="nu-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M3 4v6a2 2 0 0 0 2 2v8M21 4c-1.5 1-2 3-2 6h2v10"/></svg></span><div class="nu-txt"><strong>Log ${name}</strong><span>Usual: ${esc(usual.label)} · ${k} kcal</span></div><button class="btn small" type="button" id="nu-usual">Log usual</button><button class="link small" type="button" data-addmeal="${meal}">Other</button></div>`);
      } else rows.push(`<div class="nu-row"><span class="nu-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M3 4v6a2 2 0 0 0 2 2v8M21 4c-1.5 1-2 3-2 6h2v10"/></svg></span><div class="nu-txt"><strong>Log ${name}</strong><span>Search, scan or snap a photo</span></div><button class="btn small" type="button" data-addmeal="${meal}">Log</button></div>`);
    }
    const nu = T.nextUp();
    if (nu && !T.trainedOn(today()) && hour >= 5 && hour < 22) {
      rows.push(`<div class="nu-row"><span class="nu-ic"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span><div class="nu-txt"><strong>${nu.name ? "Train: " + esc(nu.name) : "Time to train?"}</strong><span>${nu.name ? `Next in your programme · about ${nu.mins} min` : "Pick a routine and go"}</span></div><button class="btn small" type="button" id="nu-train">Start</button></div>`);
    }
    const protLeft = Math.round(t.p - N.totals(day.entries).p);
    if (hour >= 16 && protLeft > 20 && lastSuggestions.length) {
      const it = lastSuggestions[0];
      rows.push(`<div class="nu-row"><span class="nu-ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></span><div class="nu-txt"><strong>${protLeft}g protein to go</strong><span>${esc(it.food.name)} ${it.grams}g gives you ${it.n.p}g</span></div><button class="btn small" type="button" data-sugg="0">Add</button></div>`);
    }
    const age = backupAge();
    if (mode !== "db" && !DEMO && Object.keys(S.days).length >= 7 && (age == null || age > 14) && rows.length < 3) {
      rows.push(`<div class="nu-row"><span class="nu-ic"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg></span><div class="nu-txt"><strong>Back up your log</strong><span>${age == null ? "You haven't saved a backup yet" : `Last backup ${age} days ago`}</span></div><button class="btn small" type="button" id="nu-backup">Back up</button></div>`);
    }
    if (!rows.length) return `<section class="card nextup"><div class="nu-done">You're on top of things. Nothing to do right now.</div></section>`;
    return `<section class="card nextup"><h3>Next up</h3>${rows.slice(0, 3).join("")}</section>`;
  }
  let lastUsual = null;
  const bind = {};
  bind.today = () => {
    $("#prev").onclick = () => { viewDate = N.addDays(viewDate, -1); render(); };
    $("#next").onclick = () => { if (viewDate < today()) { viewDate = N.addDays(viewDate, 1); render(); } };
    $("#add").onclick = () => openSheet();
    $("#view").querySelectorAll("[data-addmeal]").forEach((b) => (b.onclick = () => openSheet({ meal: b.dataset.addmeal })));
    const nuU = $("#nu-usual"); if (nuU) nuU.onclick = () => { logMany(lastUsual); flash("Logged your usual.", "good"); };
    const nuB = $("#nu-backup"); if (nuB) nuB.onclick = () => { tab = "me"; meSub = "backup"; render(); window.scrollTo(0, 0); };
    const nuT = $("#nu-train"); if (nuT) nuT.onclick = () => { const n = T.nextUp(); if (n) n.start(); };
    $("#view").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => {
      const day = { ...(S.days[viewDate] || {}), entries: (S.days[viewDate]?.entries || []).slice() };
      day.entries.splice(Number(b.dataset.del), 1); store.day(viewDate, day); render();
    }));
    $("#view").querySelectorAll("[data-sugg]").forEach((b) => (b.onclick = () => {
      const it = lastSuggestions[Number(b.dataset.sugg)];
      logFood(it.food, it.grams, N.mealForHour(new Date().getHours()));
    }));
    const pt = $("#plan-toggle"); if (pt) pt.onclick = () => { planOpen = !planOpen; render(); };
    $("#view").querySelectorAll("[data-plan]").forEach((b) => (b.onclick = () => {
      const pl = lastPlans[Number(b.dataset.plan)], meal = N.mealForHour(new Date().getHours());
      logMany(pl.items.map((it) => ({ food: it.food, grams: it.grams, meal })));
      planOpen = false; render();
    }));
    $("#view").querySelectorAll("[data-savem]").forEach((b) => (b.onclick = () => { savingMeal = b.dataset.savem; render(); const i = $("#meal-name"); i.focus(); i.select(); }));
    $("#view").querySelectorAll("[data-savemeal]").forEach((f) => (f.onsubmit = (e) => {
      e.preventDefault();
      const m = f.dataset.savemeal, name = $("#meal-name").value.trim() || "My " + m;
      const items = (S.days[viewDate]?.entries || []).filter((x) => x.meal === m).map((x) => ({ foodId: x.foodId, name: x.name, grams: x.grams, per100: (S.foods[x.foodId] || {}).per100 || null }));
      store.meal({ id: "m-" + uid(), name, meal: m, items });
      savingMeal = null; render(); flash(`Saved "${name}". Find it under Add food.`, "good");
    }));
    $("#view").querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => {
      const m = b.dataset.copy;
      const items = (S.days[N.addDays(viewDate, -1)]?.entries || []).filter((x) => x.meal === m);
      const day = { ...(S.days[viewDate] || {}), entries: (S.days[viewDate]?.entries || []).concat(items.map((x) => ({ ...x, t: Date.now() }))) };
      store.day(viewDate, day); render();
    }));
    const ci = $("#ci-go"); if (ci) ci.onclick = () => { tab = "me"; meSub = null; render(); window.scrollTo(0, 0); };
    const hi = $("#h-import"); if (hi) hi.onclick = () => openSheet({ step: "health" });
    const hs = $("#h-send"); if (hs) hs.onclick = () => sendToHealth(viewDate);
    const qw = $("#quick-weigh");
    if (qw) qw.onsubmit = (e) => { e.preventDefault(); const v = Number($("#qw").value); if (v > 0) { store.weight(today(), Math.round(toKg(v) * 10) / 10); render(); flash("Weight saved.", "good"); } };
  };

  function logFood(food, grams, meal) { logMany([{ food, grams, meal }]); }
  function logMany(list) {
    const day = { ...(S.days[viewDate] || {}), entries: (S.days[viewDate]?.entries || []).slice() };
    for (const { food, grams, meal } of list) {
      if (!S.foods[food.id]) store.food(food); // common foods join your library on first use
      day.entries.push({ foodId: food.id, name: food.name, grams, meal, t: Date.now(), ...N.portion(food, grams) });
    }
    store.day(viewDate, day);
    render();
  }

  // Apple Health, via the "Fuel Log to Health" shortcut. Only what hasn't been sent yet goes, so resending never doubles up.
  function sendToHealth(date) {
    const day = S.days[date] || { entries: [] };
    const tot = N.totals(day.entries), sent = day.sent || {};
    const d = {};
    for (const k of ["kcal", "p", "c", "f", "fibre"]) d[k] = Math.max(0, Math.round(((tot[k] || 0) - (sent[k] || 0)) * 10) / 10);
    if (d.kcal < 1 && d.p < 0.5) { flash("Everything for this day is already in Apple Health."); return; }
    const payload = JSON.stringify({ date, kcal: d.kcal, protein: d.p, carbs: d.c, fat: d.f, fibre: d.fibre });
    store.day(date, { ...day, sent: { ...tot } });
    location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent("Fuel Log to Health") + "&input=text&text=" + encodeURIComponent(payload);
    render();
  }

  // ---------- Recomp scorecard ----------
  function recompCard() {
    const since = Date.now() - 35 * 86400000;
    const strength = window.Workouts.strengthTrend(S.workouts, T.exIndex(), since);
    const r = N.recomp({ weights: S.weights, measures: S.measures, strength, goal: S.profile.goal, today: today() });
    const dates = Object.keys(S.measures).sort();
    const last = dates.length ? S.measures[dates[dates.length - 1]] : null;
    const bf = last && last.neck ? N.navyBodyFat(S.profile.sex, S.profile.heightCm, last.waist, last.neck) : null;
    const sign = (v, u, d = 1) => (v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d) + u);
    const icon = { good: "✓", warn: "!", info: "i" }[r.kind];
    const due = !dates.length || N.daysBetween(dates[dates.length - 1], today()) >= 6;
    return `<section class="card">
      <div class="row spread"><h2>Body change</h2><span class="small muted">last 4 weeks</span></div>
      <div class="insight"><span class="ic ${r.kind}" aria-hidden="true">${icon}</span><div><strong>${esc(r.verdict)}</strong><div class="small muted" style="margin-top:2px">${esc(r.detail)}</div></div></div>
      <div class="stats">
        <div class="stat"><span class="k">Waist</span><span class="v">${sign(r.waistChange, "")}</span><span class="s">${r.waistChange == null ? "needs 2 measures" : "cm"}</span></div>
        <div class="stat"><span class="k">Strength</span><span class="v">${sign(r.strengthPct, "%", 0)}</span><span class="s">${r.lifts ? `across ${r.lifts} lift${r.lifts > 1 ? "s" : ""}` : "needs workouts"}</span></div>
        <div class="stat"><span class="k">Weight</span><span class="v">${r.weightChange == null ? "–" : sign(unit() === "lb" ? r.weightChange * 2.20462 : r.weightChange, "")}</span><span class="s">${unit()} trend</span></div>
      </div>
      <form class="row" id="waist-form" style="align-items:end;flex-wrap:nowrap">
        <label class="field" style="flex:1"><span>Waist (cm)${due ? " · due" : ""}</span><input id="waist-in" type="number" step="0.1" inputmode="decimal" placeholder="${last ? last.waist : "e.g. 86"}"></label>
        <label class="field" style="flex:1"><span>Neck (cm), optional</span><input id="neck-in" type="number" step="0.1" inputmode="decimal" placeholder="${last && last.neck ? last.neck : "e.g. 39"}"></label>
        <button class="btn" type="submit">Save</button>
      </form>
      <p class="small muted" style="margin:0">Measure weekly, first thing in the morning: tape level around your belly button, relaxed, not sucked in.${bf != null ? ` Estimated body fat: <strong>${bf}%</strong> (US Navy method; roughly ±3%).` : S.profile.sex === "male" ? " Add your neck measurement for a body-fat estimate." : ""}</p>
    </section>`;
  }

  // ---------- Weight ----------
  function weightView(t) {
    const tr = N.trend(S.weights);
    const last = tr[tr.length - 1];
    const rate = N.weeklyChange(S.weights);
    const target = t.weeklyTargetKg;
    const conv = (kg) => (unit() === "lb" ? kg * 2.20462 : kg);
    const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2);
    const first = Object.keys(S.weights).sort()[0];
    const totalChange = last && first ? last.trend - S.weights[first] : null;
    const hist = Object.keys(S.weights).sort().reverse().slice(0, 30);
    return `<div class="app" style="gap:14px">
      <section class="card">
        <div class="row spread"><h2>Weight</h2><div class="seg" id="range">${[[30, "30d"], [90, "90d"], [0, "All"]].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${weightRange === v}">${l}</button>`).join("")}</div></div>
        <div class="stats">
          <div class="stat"><span class="k">Now (smoothed)</span><span class="v">${last ? fmtW(last.trend) : "–"}</span><span class="s">${unit()}</span></div>
          <div class="stat"><span class="k">Per week</span><span class="v">${rate == null ? "–" : sign(conv(rate))}</span><span class="s">${rate == null ? "needs 7 days" : `aim ${sign(conv(target))}`}</span></div>
          <div class="stat"><span class="k">Since start</span><span class="v">${totalChange == null ? "–" : sign(conv(totalChange)).replace(/(\.\d)\d$/, "$1")}</span><span class="s">${first ? "from " + new Date(first + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : ""}</span></div>
        </div>
        <div class="chart-wrap" id="chart">${chart(tr)}</div>
        <div class="legend"><span><i style="width:8px;height:8px;border-radius:50%;background:var(--muted)"></i>Each weigh-in</span><span><i style="width:16px;height:2px;border-radius:2px;background:var(--ink)"></i>Smoothed trend</span></div>
        <form class="row" id="weigh" style="align-items:end;flex-wrap:nowrap">
          <label class="field" style="flex:1"><span>${S.weights[today()] != null ? "Today's weigh-in" : "Weigh in today"} (${unit()})</span><input id="w-val" type="number" step="0.1" inputmode="decimal" value="${S.weights[today()] != null ? fmtW(S.weights[today()]) : ""}" placeholder="${fmtW(N.latestWeight(S.weights))}"></label>
          <input id="w-date" type="hidden" value="${today()}">

  let chartPts = [];
  function chart(trAll) {
    const tr = weightRange ? trAll.slice(-weightRange) : trAll;
    if (tr.length < 2) return `<p class="empty">Log two or more weigh-ins to see your trend.</p>`;
    const W = 380, H = 200, L = 38, R = 8, T = 10, B = 24;
    const vals = tr.flatMap((p) => [p.trend, p.weight].filter((x) => x != null)).map((kg) => Number(fmtW(kg, 2)));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(0.4, (hi - lo) * 0.15); lo -= pad; hi += pad;
    const step = [0.25, 0.5, 1, 2, 5, 10].find((s) => (hi - lo) / s <= 5) || 20;
    const x = (i) => L + (i / (tr.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    let grid = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-num)">${Number(v.toFixed(2))}</text>`;
    const fmtD = (d) => new Date(d + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const xl = `<text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmtD(tr[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtD(tr[tr.length - 1].date)}</text>`;
    const conv = (kg) => Number(fmtW(kg, 2));
    const line = tr.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(conv(p.trend)).toFixed(1)}`).join("");
    const dots = tr.map((p, i) => (p.weight == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(conv(p.weight)).toFixed(1)}" r="3" fill="var(--muted)" fill-opacity="0.55"/>`)).join("");
    const lastI = tr.length - 1;
    chartPts = tr.map((p, i) => ({ ...p, cx: x(i), cy: y(conv(p.trend)) }));
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">${grid}${xl}${dots}
      <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(lastI)}" cy="${y(conv(tr[lastI].trend))}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <line id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  }

  // Save many records without overwhelming the store: one at a time in your Claude account, all at once on the device.
  async function bulkSave(list, progress) {

    let i = 0;

        catch (e) { if (e && e.code === "quota_exceeded") throw e; await new Promise((r) => setTimeout(r, 600 * (tries + 1))); }

      if (++i % 5 === 0 || i === list.length) progress(i, list.length);

      const dec = new TextDecoder();
      const feed = (bytes, final) => {
        buf += dec.decode(bytes, { stream: !final });
        const lines = buf.split("\n"); buf = final ? "" : lines.pop();

          let found = false, finished = null;

          for (;;) {
            const { value, done: end } = await reader.read();
            if (end) { unzip.push(new Uint8Array(), true); break; }
            read += value.length; unzip.push(value, false); tick();
            await new Promise((r) => setTimeout(r, 0)); // keep the page responsive
          }
          if (!found) throw new Error("export.xml wasn't found inside that zip. Choose the export.zip the Health app made.");
          await done;
        }

        dlg.close(); logMany(list); flash(`Logged ${m.name} to ${sh.meal}.`, "good");
      }));
    } else if (sh.step === "typebc") {
      el.innerHTML = head("Type barcode") + `<form id="tbc" class="row"><input type="text" id="tbc-v" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 5000159484695" style="flex:1" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form><button class="link" type="button" id="back">Back</button>`;
      $("#tbc").onsubmit = (e) => { e.preventDefault(); const v = $("#tbc-v").value.replace(/\D/g, ""); if (v.length >= 8) lookupBarcode(v); };
      $("#back").onclick = () => { sh.step = "choose"; drawSheet(); };
      $("#tbc-v").focus();
    } else if (sh.step === "plate") {
      const tot = { kcal: 0, p: 0 };
      for (const it of sh.plate) if (it.on) { const n = N.portion(it, it.grams); tot.kcal += n.kcal; tot.p += n.p; }
      el.innerHTML = head("Check your meal") + `
        <p class="small muted" style="margin:0">Claude's estimate from the photo. Adjust the grams if anything looks off, untick what you didn't eat.${sh.plateNote ? " " + esc(sh.plateNote) : ""}</p>
        <div class="results" style="max-height:46vh">${sh.plate.map((it, k) => { const n = N.portion(it, it.grams); return `<div class="entry" style="grid-template-columns:auto minmax(0,1fr) 5.2rem">
          <input type="checkbox" data-pon="${k}" ${it.on ? "checked" : ""} aria-label="Include ${esc(it.name)}" style="width:22px;height:22px;accent-color:var(--primary)">
          <div><div class="nm">${esc(it.name)}</div><div class="sub">${n.kcal} kcal · ${n.p}g protein</div></div>
          <input type="number" inputmode="numeric" data-pg="${k}" value="${it.grams}" aria-label="Grams of ${esc(it.name)}" style="text-align:center"></div>`; }).join("")}</div>
        <div class="row spread"><strong class="num">${Math.round(tot.kcal)} kcal · ${Math.round(tot.p)}g protein</strong>
          <select id="plate-meal" style="width:auto">${N.MEALS.map((m) => `<option value="${m}" ${m === sh.meal ? "selected" : ""}>${m[0].toUpperCase() + m.slice(1)}</option>`).join("")}</select></div>
        <button class="btn wide" type="button" id="plate-log" ${sh.plate.some((x) => x.on) ? "" : "disabled"}>Log ${sh.plate.filter((x) => x.on).length} item${sh.plate.filter((x) => x.on).length === 1 ? "" : "s"}</button>`;
      el.querySelectorAll("[data-pon]").forEach((c) => (c.onchange = () => { sh.plate[Number(c.dataset.pon)].on = c.checked; drawSheet(); }));
      el.querySelectorAll("[data-pg]").forEach((g) => (g.onchange = () => { sh.plate[Number(g.dataset.pg)].grams = Math.max(1, Math.round(Number(g.value) || 1)); drawSheet(); }));
      $("#plate-meal").onchange = (e) => (sh.meal = e.target.value);
      $("#plate-log").onclick = () => {
        const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
        const list = sh.plate.filter((x) => x.on).map((it) => {
          const id = "ai-" + slug(it.name);
          const food = S.foods[id] && S.foods[id].source !== "photo estimate" ? S.foods[id] : { id, name: it.name, brand: "", barcode: "", per100: it.per100, servingG: it.grams, source: "photo estimate" };
          return { food, grams: it.grams, meal: sh.meal };
        });
        dlg.close(); logMany(list); flash(`Logged ${list.length} item${list.length === 1 ? "" : "s"} from your photo.`, "good");
      };
    } else if (sh.step === "camera") {
      el.innerHTML = head("Scan barcode") + `<video id="cam" playsinline muted style="width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
        <div class="status" role="status" id="cam-status">Starting camera…</div>
        <button class="link" type="button" id="back">Back</button>`;
      $("#back").onclick = () => { stopCamera(); sh.step = "choose"; drawSheet(); };
      startCamera($("#cam"));
    } else if (sh.step === "health") {
      el.innerHTML = head("Import from Apple Health") + `
        <p class="small muted" style="margin:0">Run your <strong>Health to Fuel Log</strong> shortcut, come back here, then paste. Setup steps are on the Plan tab.</p>
        ${!inClaude ? `<button class="btn wide" type="button" id="h-clip">Paste from clipboard</button>` : ""}
        <textarea id="h-text" rows="5" placeholder="Or paste the copied text here"></textarea>
        ${sh.status ? `<div class="status ${sh.statusKind || ""}" role="status">${esc(sh.status)}</div>` : ""}`;
      const apply = (text) => {
        const h = N.parseHealth(text, today());
        if (!h) { sh.status = "That doesn't look like the shortcut's text. It should start with a line saying Fuel Log."; sh.statusKind = "warn"; drawSheet(); return; }
        const { date, weight, ...rest } = h;
        store.health(date, { ...(S.health[date] || {}), ...rest });
        if (weight) store.weight(date, weight);
        dlg.close(); render();
        flash(`Imported ${[rest.steps != null && "steps", rest.active != null && "active calories", rest.sleepH != null && "sleep", weight && "weight"].filter(Boolean).join(", ")} for ${date === today() ? "today" : date}.`, "good");
      };
      const ta = $("#h-text");
      ta.addEventListener("paste", (e) => { const t = e.clipboardData && e.clipboardData.getData("text"); if (t) { e.preventDefault(); apply(t); } });
      ta.addEventListener("change", () => ta.value && apply(ta.value));
      const cb = $("#h-clip");
      if (cb) cb.onclick = () => { try { navigator.clipboard.readText().then(apply, () => { sh.status = "Couldn't read the clipboard. Long-press the box below and choose Paste."; sh.statusKind = "warn"; drawSheet(); }); } catch (e) { ta.focus(); } };
    } else if (sh.step === "busy") {
      el.innerHTML = head("Add food") + `<div class="status" role="status">${esc(sh.status)}</div>`;
    } else if (sh.step === "form") {
      const f = sh.food;
      const num = (k, label) => `<label class="field"><span>${label}</span><input type="number" step="0.1" inputmode="decimal" id="ff-${k}" value="${f.per100[k] ?? ""}"></label>`;
      el.innerHTML = head(sh.existing ? "Edit food" : "New food") + `
        ${sh.status ? `<div class="status ${sh.statusKind || ""}" role="status">${esc(sh.status)}</div>` : ""}
        <form id="ff" class="grid2" style="grid-template-columns:minmax(0,1fr)">
          <label class="field"><span>Name</span><input type="text" id="ff-name" value="${esc(f.name)}" required></label>
          <div class="grid2"><label class="field"><span>Brand</span><input type="text" id="ff-brand" value="${esc(f.brand)}"></label><label class="field"><span>Barcode</span><input type="text" id="ff-barcode" inputmode="numeric" value="${esc(f.barcode)}"></label></div>
          <h3>Per 100g</h3>
          <div class="grid3">${num("kcal", "Calories")}${num("p", "Protein g")}${num("c", "Carbs g")}${num("f", "Fat g")}${num("fibre", "Fibre g")}<label class="field"><span>Serving g</span><input type="number" inputmode="decimal" id="ff-serving" value="${f.servingG ?? ""}"></label></div>
          ${aiImages() && !sh.existing ? `<label class="btn ghost wide" style="position:relative;text-align:center">Fill from a label photo<input type="file" id="ff-label" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>` : ""}
          <div class="row">${sh.existing ? `<button class="btn ghost" type="button" id="ff-del">Delete</button>` : ""}<button class="btn" type="submit" style="flex:1">${sh.editOnly ? "Save food" : "Save and choose amount"}</button></div>
        </form>`;
      const fl = $("#ff-label"); if (fl) fl.onchange = (e) => e.target.files[0] && readLabel(e.target.files[0], collectForm());
      const del = $("#ff-del"); if (del) del.onclick = () => { store.dropFood(f.id); dlg.close(); render(); };
      $("#ff").onsubmit = (e) => {
        e.preventDefault();
        const food = collectForm();
        if (!food.name || !(food.per100.kcal >= 0)) return;
        store.food(food);
        if (sh.editOnly) { dlg.close(); render(); return; }
        sh.step = "portion"; sh.food = food; sh.status = null; drawSheet();
      };
    } else if (sh.step === "portion") {
      const f = sh.food;
      const hab = N.habits(S.days, today(), 120)[f.id];
      sh.grams = sh.grams || hab?.avgGrams || f.servingG || 100;
      const unitChips = (f.units || []).map((u) => ({ g: u.g, label: `1 ${u.label} (${u.g}g)` })).concat((f.units || []).slice(0, 1).map((u) => ({ g: u.g * 2, label: `2 × ${u.label} (${u.g * 2}g)` })));
      const chips = unitChips.length ? unitChips.concat(hab?.avgGrams ? [{ g: hab.avgGrams, label: `${hab.avgGrams}g (usual)` }] : [], [{ g: 100, label: "100g" }])
        : [...new Set([f.servingG, hab?.avgGrams, 100, 50, 150].filter(Boolean))].map((g) => ({ g, label: `${g}g${g === f.servingG ? " (serving)" : g === hab?.avgGrams ? " (usual)" : ""}` }));
      const n = N.portion(f, sh.grams);
      el.innerHTML = head(esc(f.name)) + `
        <div class="preview"><div><b>${n.kcal}</b><span>kcal</span></div><div><b style="color:var(--protein)">${n.p}</b><span>protein</span></div><div><b style="color:var(--carbs)">${n.c}</b><span>carbs</span></div><div><b style="color:var(--fat)">${n.f}</b><span>fat</span></div></div>
        <div class="grid2"><label class="field"><span>Amount (g or ml)</span><input type="number" id="pg" inputmode="decimal" value="${sh.grams}"></label>
          <label class="field"><span>Meal</span><select id="pm">${N.MEALS.map((m) => `<option value="${m}" ${m === sh.meal ? "selected" : ""}>${m[0].toUpperCase() + m.slice(1)}</option>`).join("")}</select></label></div>
        ${f.source === "UK typical values" ? `<p class="small muted" style="margin:0">Typical UK values. If you have the pack, its label is more accurate.</p>` : ""}
        <div class="chips">${chips.map((c) => `<button type="button" data-g="${c.g}">${esc(c.label)}</button>`).join("")}</div>
        <button class="btn wide" type="button" id="log">Log ${viewDate === today() ? "for today" : "for " + new Date(viewDate + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</button>
        <button class="link" type="button" id="editfood">Edit nutrition values</button>`;
      const pg = $("#pg");
      pg.oninput = () => { sh.grams = Number(pg.value) || 0; const v = N.portion(f, sh.grams); el.querySelectorAll(".preview b").forEach((b, i) => (b.textContent = [v.kcal, v.p, v.c, v.f][i])); };
      $("#pm").onchange = (e) => (sh.meal = e.target.value);
      el.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { sh.grams = Number(b.dataset.g); drawSheet(); }));
      $("#log").onclick = () => { if (sh.grams > 0) { dlg.close(); logFood(f, sh.grams, sh.meal); } };
      $("#editfood").onclick = () => { sh.step = "form"; sh.food = { ...f }; sh.existing = true; drawSheet(); };
    }
    const c = $("#sh-close"); if (c) c.onclick = () => dlg.close();
  }
  function collectForm() {
    const g = (id) => $("#ff-" + id).value;
    const n = (id) => (g(id) === "" ? 0 : Math.round(Number(g(id)) * 10) / 10);
    const barcode = g("barcode").replace(/\D/g, "");
    const id = sh.food.id || (barcode ? "bc-" + barcode : "f-" + uid());
    return { ...sh.food, id, barcode, name: g("name").trim(), brand: g("brand").trim(), per100: { kcal: Math.round(n("kcal")), p: n("p"), c: n("c"), f: n("f"), fibre: n("fibre") }, servingG: n("serving") || null };
  }

  // Shrink big phone photos before decoding or sending them anywhere.
  async function shrink(file, max = 1400) {
    const img = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  async function decodeBarcode(file) {
    const canvas = await shrink(file, 1600);
    if ("BarcodeDetector" in window) {
      try {
        const found = await new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] }).detect(canvas);
        if (found.length) return found[0].rawValue;
      } catch (e) {}
    }
    if (window.ZXing) {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      try { return (await reader.decodeFromImageUrl(canvas.toDataURL("image/jpeg", 0.92))).getText(); } catch (e) {}
    }
    return null;
  }
  async function handleBarcodePhoto(file) {
    sh.step = "busy"; sh.status = "Reading barcode…"; drawSheet();
    const code = await decodeBarcode(file).catch(() => null);
    if (!code) { sh.step = "choose"; sh.status = "Couldn't read a barcode in that photo. Get closer, fill the frame with the barcode, and avoid glare. Or type the number."; sh.statusKind = "warn"; drawSheet(); return; }
    lookupBarcode(code);
  }
  async function lookupBarcode(code) {
    sh.statusKind = "";
    const known = Object.values(S.foods).find((f) => f.barcode === code);
    if (known) { sh.step = "portion"; sh.food = known; sh.status = null; drawSheet(); return; }
    sh.step = "busy"; sh.status = `Barcode ${code}. Looking it up…`; drawSheet();
    let food = null;
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_quantity`, { signal: ctl.signal });
      clearTimeout(timer);
      const j = await r.json();
      if (j.product) food = N.fromOpenFoodFacts(code, j.product);
    } catch (e) {}
    sh.step = "form";
    if (food) { sh.food = food; sh.status = "Found on Open Food Facts. Check the values against the pack, then save."; sh.statusKind = ""; }
    else {
      sh.food = blankFood(code);
      sh.status = aiImages() ? `Barcode ${code} is new. Photograph the nutrition label and Claude will fill this in, or type the values. Next time you scan it, it's instant.` : `Barcode ${code} is new. Enter the values from the pack once; next time you scan it, it's instant.`;
      sh.statusKind = "warn";
    }
    drawSheet();
  }
  // ---------- Claude ----------
  // In the Claude version, requests go through your Claude account. In the
  // installed app they use your own Anthropic API key, kept only on this device.
  const AI_KEY = "fuel-log-anthropic-key";
  const apiKey = () => { try { return localStorage.getItem(AI_KEY) || ""; } catch (e) { return ""; } };
  const aiText = () => !!sample || (!inClaude && !!apiKey());
  const aiImages = () => (sample && imagesOk) || (!inClaude && !!apiKey());
  let sdkP = null;
  async function apiClient() {
    sdkP = sdkP || import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.129.0/+esm");
    const { default: Anthropic } = await sdkP;
    return new Anthropic({ apiKey: apiKey(), dangerouslyAllowBrowser: true });
  }
  const blobToB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
  async function apiAsk(prompt, images = []) {
    const client = await apiClient();
    const content = [];
    for (const b of images) content.push({ type: "image", source: { type: "base64", media_type: b.type || "image/jpeg", data: await blobToB64(b) } });
    content.push({ type: "text", text: prompt });
    const r = await client.beta.messages.create({
      model: "claude-opus-5-5", max_tokens: 4000,
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
      output_config: { effort: "low" },
      messages: [{ role: "user", content }],
    });
    if (r.stop_reason === "refusal") throw { code: "refusal" };
    return r.content.filter((b) => b.type === "text").map((b) => b.text).join("");
  }
  async function claudeJSON(prompt, images) {
    if (sample) return sample.json(prompt, images ? { images, modelTier: "default" } : { modelTier: "default" });
    const text = await apiAsk(prompt + "\n\nReply with the JSON only, no other text.", images || []);
    const m = text.match(/[\[{][\s\S]*[\]}]/);
    return JSON.parse(m ? m[0] : text);
  }
  async function claudeText(prompt, onText) {
    if (sample) return (await sample(prompt, { onText })).text;
    const text = await apiAsk(prompt);
    if (onText) onText({ text });
    return text;
  }
  function aiError(e) {
    const status = e && (e.status || (e.error && e.error.status));
    if (status === 401) return "Your Anthropic API key was rejected. Check it on the Plan tab.";
    if (status === 429 || (e && e.code === "rate_limited")) return "Claude is busy. Try again in a minute.";
    if (e && e.code === "not_granted") return "Claude access wasn't allowed for this page.";
    if (e && e.code === "refusal") return "Claude couldn't help with that photo.";
    return "Couldn't reach Claude. Check your connection and try again.";
  }

  // ---------- Photo of a meal ----------
  async function readMeal(file) {
    sh.step = "busy"; sh.status = "Claude is looking at your meal…"; drawSheet();
    try {
      const canvas = await shrink(file, 1400);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85));
      const out = await claudeJSON(
        `This photo shows a meal or snack someone is about to log in a UK calorie tracker. Identify each separate food or drink visible, estimate its portion in grams (ml for drinks) from the plate, packaging and utensils, and estimate the nutrition of that portion using typical UK recipes. Include cooking oil, butter and sauces when they're visible or likely. Be realistic rather than optimistic about portions. Return JSON: {"items": [{"name": short food name, "grams": number, "kcal": number, "protein": number, "carbs": number, "fat": number, "fibre": number}], "confidence": "low" | "medium" | "high", "note": one short sentence on anything uncertain}. If there's no food in the photo, return {"items": [], "confidence": "low", "note": "No food found"}.`, [blob]);
      const num = (x) => (typeof x === "number" && isFinite(x) && x >= 0 ? x : 0);
      sh.plate = (out.items || []).filter((it) => it && it.name && num(it.grams) > 0).map((it) => ({
        name: String(it.name).slice(0, 60), grams: Math.round(num(it.grams)), on: true,
        per100: { kcal: Math.round((num(it.kcal) / num(it.grams)) * 100), p: Math.round((num(it.protein) / num(it.grams)) * 1000) / 10, c: Math.round((num(it.carbs) / num(it.grams)) * 1000) / 10, f: Math.round((num(it.fat) / num(it.grams)) * 1000) / 10, fibre: Math.round((num(it.fibre) / num(it.grams)) * 1000) / 10 },
      }));
      sh.plateNote = [out.confidence ? `Confidence: ${out.confidence}.` : "", out.note || ""].join(" ").trim();
      if (!sh.plate.length) { sh.step = "choose"; sh.status = "Claude couldn't see any food in that photo. Try again with the whole plate in frame."; sh.statusKind = "warn"; drawSheet(); return; }
      sh.step = "plate"; sh.status = null;
    } catch (e) { sh.step = "choose"; sh.status = aiError(e); sh.statusKind = "warn"; }
    drawSheet();
  }

  async function readLabel(file, base) {
    sh.step = "busy"; sh.status = "Claude is reading the label…"; drawSheet();
    try {
      const canvas = await shrink(file, 1400);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85));
      const out = await claudeJSON(
        `This photo shows a food package's nutrition label (and maybe its front). Read the PER 100g (or per 100ml) column. Use kcal, not kJ; if only kJ is shown, divide by 4.184. Return JSON only: {"name": product name or "" if not visible, "brand": "" if not visible, "kcal": number, "protein": number, "carbs": number, "fat": number, "fibre": number or 0, "servingG": serving size in grams or null}. Use null for any value you cannot read.`,
        [blob]);
      const v = (x) => (typeof x === "number" && isFinite(x) ? x : "");
      sh.food = { ...base, name: base.name || out.name || "", brand: base.brand || out.brand || "", per100: { kcal: v(out.kcal), p: v(out.protein), c: v(out.carbs), f: v(out.fat), fibre: v(out.fibre) }, servingG: out.servingG || base.servingG || "", source: "label" };
      sh.status = "Filled from the label. Check the numbers, then save."; sh.statusKind = "";
    } catch (e) {
      sh.food = base;
      sh.status = e && (e.status || e.code) ? aiError(e) : "Couldn't read that label. Try a sharper, straight-on photo, or type the values.";
      sh.statusKind = "warn";
    }
    sh.step = "form"; drawSheet();
  }

  const T = window.TrainUI({
    S, store, $, esc, flash, uid, today, iso: N.iso, daysBetween: N.daysBetween, unit, fmtW,
    render: () => render(), go: (t) => { tab = t; render(); }, tab: () => tab,
    sheet: showSheet, closeSheet: () => { if (dlg.open) dlg.close(); },
    shrink: (f, m) => shrink(f, m), assets: () => assets, trend: () => N.trend(S.weights),
  });

  loadLocal();
  render();
  connect().catch(() => { booting = false; setStore(); render(); });
})();
</script>
