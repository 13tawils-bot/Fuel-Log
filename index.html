<title>Fuel Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column on marble. Translucent stone cards with hairline
   edges, a serif for titles and big numbers, small tracked capitals for labels,
   black pill buttons, and brushed brass kept for moments that matter. */
:root {
  --bg: #F3F3F0;
  --card: #FDFDFB;
  --ink: #141413;
  --muted: #7B7873;
  --line: #E2E0DA;
  --chalk: #EEEDE9;
  --primary: #141413;
  --primary-ink: #FAF9F6;
  --primary-soft: #EAE8E3;
  --accent: #9C7A3C;
  --protein: #9E3D4A;
  --carbs: #3567A3;
  --fat: #A9842F;
  --fibre: #8C8A84;
  --good: #4C7A55;
  --good-soft: #E6EDE5;
  --warn: #A8692A;
  --danger: #A23B3B;
  --shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 10px 30px rgba(30,26,20,0.06);
  --marble: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='900'%20height='1300'%3E%20%3Cfilter%20id='v'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='turbulence'%20baseFrequency='0.0015%200.0048'%20numOctaves='7'%20seed='4'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.4%200%200%200%200%200.39%200%200%200%200%200.37%20-5%200%200%200%200.92'/%3E%3C/filter%3E%20%3Cfilter%20id='c'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.0018%200.004'%20numOctaves='3'%20seed='5'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.4%200%200%200%200%200.39%200%200%200%200%200.37%200%200%200%201.2%20-0.45'/%3E%3C/filter%3E%20%3Cg%20transform='rotate(-28%20450%20650)%20scale(1.6)'%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23c)'%20opacity='0.16'/%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23v)'%20opacity='0.5'/%3E%3C/g%3E%3C/svg%3E");
  --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: var(--font-body);
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0C; --card: #151515; --ink: #ECEAE5; --muted: #8E8B85; --line: #282725; --chalk: #1F1F1E;
    --primary: #ECEAE5; --primary-ink: #0B0B0C; --primary-soft: #232322; --accent: #C6A15B;
    --protein: #D06A7A; --carbs: #5E8FD0; --fat: #AA873A; --fibre: #8E8B85; --good: #84AE8B; --good-soft: #16201A; --warn: #D49B5C; --danger: #D9746D;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 34px rgba(0,0,0,0.45);
    --marble: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='900'%20height='1300'%3E%20%3Cfilter%20id='v'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='turbulence'%20baseFrequency='0.0015%200.0048'%20numOctaves='7'%20seed='4'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.9%200%200%200%200%200.89%200%200%200%200%200.86%20-5%200%200%200%200.92'/%3E%3C/filter%3E%20%3Cfilter%20id='c'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.0018%200.004'%20numOctaves='3'%20seed='5'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.9%200%200%200%200%200.89%200%200%200%200%200.86%200%200%200%201.2%20-0.45'/%3E%3C/filter%3E%20%3Cg%20transform='rotate(-28%20450%20650)%20scale(1.6)'%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23c)'%20opacity='0.08'/%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23v)'%20opacity='0.34'/%3E%3C/g%3E%3C/svg%3E");
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0C; --card: #151515; --ink: #ECEAE5; --muted: #8E8B85; --line: #282725; --chalk: #1F1F1E;
  --primary: #ECEAE5; --primary-ink: #0B0B0C; --primary-soft: #232322; --accent: #C6A15B;
  --protein: #D06A7A; --carbs: #5E8FD0; --fat: #AA873A; --fibre: #8E8B85; --good: #84AE8B; --good-soft: #16201A; --warn: #D49B5C; --danger: #D9746D;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 34px rgba(0,0,0,0.45);
  --marble: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='900'%20height='1300'%3E%20%3Cfilter%20id='v'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='turbulence'%20baseFrequency='0.0015%200.0048'%20numOctaves='7'%20seed='4'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.9%200%200%200%200%200.89%200%200%200%200%200.86%20-5%200%200%200%200.92'/%3E%3C/filter%3E%20%3Cfilter%20id='c'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.0018%200.004'%20numOctaves='3'%20seed='5'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.9%200%200%200%200%200.89%200%200%200%200%200.86%200%200%200%201.2%20-0.45'/%3E%3C/filter%3E%20%3Cg%20transform='rotate(-28%20450%20650)%20scale(1.6)'%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23c)'%20opacity='0.08'/%3E%3Crect%20x='-300'%20y='-300'%20width='1500'%20height='1700'%20filter='url(%23v)'%20opacity='0.34'/%3E%3C/g%3E%3C/svg%3E");
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); -webkit-font-smoothing: antialiased; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
header.bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 14px 2px; }
.brand { min-width: 0; flex: 1; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
.brand small { display: block; font-weight: 500; font-size: 0.8rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store { font-size: 11px; color: var(--muted); text-align: right; padding-bottom: 3px; max-width: 34%; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; margin: 0; }
h3 { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; color: var(--muted); }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > * { min-width: 0; }
#view { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; background: var(--primary); color: var(--primary-ink); font-weight: 600; font-size: 16px; }
.btn.ghost { background: var(--chalk); color: var(--primary); }
.btn.small { padding: 7px 13px; font-size: 14px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.link { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 500; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
/* 16px stops iPhone zooming into a field when it's tapped. */
input:not([type]), input[type="number"], input[type="text"], input[type="search"], input[type="date"], select, textarea { background: var(--chalk); border: 0; border-radius: 10px; padding: 11px 12px; min-width: 0; width: 100%; font-size: 16px; }
label.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
label.field > span { font-weight: 500; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 0; background: var(--chalk); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }

/* Today */
.daynav { display: flex; align-items: center; justify-content: space-between; }
.daynav button { background: var(--card); border: 0; border-radius: 10px; width: 38px; height: 34px; font-size: 18px; color: var(--primary); }
.daynav button:disabled { opacity: 0.3; cursor: default; }
.daynav h2 { text-align: center; flex: 1; font-size: 1.05rem; }
.left { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.left .big { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.left .over { color: var(--warn); }
.macros { display: grid; gap: 10px; }
.macro { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.macro .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.macro .name i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.track { height: 8px; border-radius: 4px; background: var(--chalk); overflow: hidden; }
.track b { display: block; height: 100%; border-radius: 4px; }
.macro .val { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.macro .val strong { color: var(--ink); font-weight: 600; }
.meal { display: grid; gap: 2px; }
.meal + .meal { margin-top: 8px; }
.meal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px; min-height: 34px; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.entry .nm { overflow-wrap: anywhere; font-weight: 500; }
.entry .sub { font-size: 12.5px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.x:hover { color: var(--danger); }
.sugg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.sugg:first-of-type { border-top: 0; }
.sugg .why { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chalk); color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 14px; }

/* Next up */
.nextup { gap: 4px; }
.nu-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.nextup h3 + .nu-row { border-top: 0; }
.nu-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); display: grid; place-items: center; font-size: 16px; }
.nu-txt strong { display: block; font-size: 15px; }
.nu-txt span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nu-done { color: var(--muted); font-size: 14.5px; }
details.more summary { cursor: pointer; font-size: 13.5px; color: var(--primary); font-weight: 500; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " ›"; }
details.more[open] summary::after { content: " ⌄"; }
.wins-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.wchips { display: flex; gap: 6px; flex-wrap: wrap; }
.wchip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; background: var(--chalk); border-radius: 999px; padding: 4px 10px 4px 5px; }
.wchip i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 10px; color: #fff; }
.wchip.on { background: var(--good-soft); }
.wchip.on i { background: var(--good); border-color: var(--good); }
.good-t { color: var(--good); font-weight: 700; }
.add-meals { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
.chip-btn { border: 0; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 600; }
.chip-btn.ghost { background: var(--chalk); color: var(--ink); }
.quick-add { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; }
.qa { position: relative; border: 0; background: var(--chalk); border-radius: 14px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer; }
.qa svg { width: 24px; height: 24px; fill: none; stroke: var(--primary); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.qa input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.settings { gap: 0; }
.settings h3 { margin-bottom: 6px; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 0; text-align: left; color: var(--ink); }
.settings h3 + .set-row { border-top: 0; }
.set-row strong { display: block; font-size: 15.5px; font-weight: 500; }
.set-row span span { display: block; font-size: 12.5px; color: var(--muted); }
.set-row .chev { color: var(--muted); font-size: 20px; }

/* Won the day */
.wins { gap: 12px; }
.win-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.win { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; background: var(--chalk); border-radius: 12px; padding: 10px; }
.win b { display: block; font-size: 14px; }
.win span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.win-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }
.win.on { background: var(--good-soft); }
.win.on .win-dot { background: var(--good); border-color: var(--good); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.wd i { width: 26px; height: 26px; border-radius: 50%; background: var(--chalk); display: block; }
.wd.great i { background: var(--good); }
.wd.good i { background: color-mix(in srgb, var(--good) 45%, var(--chalk)); }
.wd.miss i { background: color-mix(in srgb, var(--danger) 35%, var(--chalk)); }
.wd.future i { background: transparent; border: 2px dashed var(--line); }
.wd.today i { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary); }
.wd.today span { color: var(--primary); font-weight: 700; }
@media (max-width: 370px) { .win { grid-template-columns: minmax(0, 1fr); justify-items: start; } }

/* Body */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--muted); }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--card); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.hist { display: grid; }
.hist .entry { grid-template-columns: minmax(0, 1fr) auto auto; }

/* Insights */
.insight { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; font-size: 14.5px; }
.insight .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; margin-top: 1px; }
.ic.good { background: var(--good); } .ic.warn { background: var(--warn); } .ic.swap { background: var(--primary); } .ic.info { background: var(--muted); }
.coach { white-space: pre-wrap; font-size: 14.5px; }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--line); padding: 6px 8px calc(4px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 5; }
nav.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 560px; }
nav.tabs button { background: none; border: 0; padding: 4px 2px; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--muted); }
nav.tabs svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--primary); }

/* Sheets */
dialog { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 20px 20px 0 0; background: var(--card); color: var(--ink); margin: auto auto 0; }
dialog::backdrop { background: rgba(0,0,0,0.4); }
.sheet { padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet::before { content: ""; justify-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin-top: -8px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { position: relative; display: grid; gap: 2px; text-align: left; border: 0; background: var(--chalk); border-radius: 14px; padding: 13px; }
.choice strong { font-size: 15px; font-weight: 600; }
.choice span { font-size: 12.5px; color: var(--muted); }
.choice input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.results { display: grid; max-height: 40vh; overflow-y: auto; }
.result { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 2px; }
.status { font-size: 14px; padding: 11px 13px; border-radius: 12px; background: var(--chalk); }
.status.warn { color: var(--warn); }
.status.good { color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; background: var(--chalk); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.preview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.preview div { background: var(--chalk); border-radius: 12px; padding: 10px 4px; }
.preview b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.preview span { font-size: 11.5px; color: var(--muted); }
.health { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; align-items: center; }
.health b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--primary); color: var(--primary-ink); border-radius: var(--radius); padding: 13px 16px; border: 0; width: 100%; text-align: left; }
.banner strong { font-weight: 700; font-size: 1rem; }
.plan { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
.plan ul { margin: 0; padding-left: 18px; font-size: 14px; }
.meal-actions { display: flex; gap: 8px; align-items: center; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 2px 2px; }

.ci span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.ci b { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
details.how summary { cursor: pointer; font-weight: 600; color: var(--primary); }
details.how ol { padding-left: 20px; margin: 8px 0; display: grid; gap: 6px; font-size: 14px; }
details.how code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--chalk); padding: 1px 5px; border-radius: 5px; }
pre.snip { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--chalk); padding: 8px 10px; border-radius: 10px; margin: 4px 0; white-space: pre-wrap; }

/* Workout logger */
.wk-head { gap: 10px; }
.wk-name { font-family: var(--font-display); font-size: 1.3rem !important; font-weight: 700; border: 0 !important; padding: 0 !important; background: transparent !important; flex: 1 1 0; min-width: 0; width: auto !important; }
.wk-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wk-stats div { display: grid; }
.wk-stats span { font-size: 12px; color: var(--muted); }
.wk-stats b { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.ex-card { gap: 10px; padding-inline: 12px; }
.exname { background: none; border: 0; padding: 0; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; color: var(--primary); flex: 1; min-width: 0; }
.ex-menu { background: var(--chalk); border: 0; border-radius: 10px; width: 36px; height: 32px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
.hint { margin: 0; font-size: 13px; color: var(--good); }
.note { border-radius: 0 !important; padding: 2px 0 !important; font-size: 15px !important; background: transparent !important; color: var(--ink); }
.note::placeholder { color: var(--muted); }
.rest-btn { background: none; border: 0; padding: 0; color: var(--primary); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
.rest-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
table.sets { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 15px; }
table.sets th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; text-align: center; padding: 0 2px; }
table.sets td { padding: 2px; text-align: center; vertical-align: middle; }
table.sets td.prev { color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.sets tr.done td { background: var(--good-soft); }
table.sets tr.done td:first-child { border-radius: 10px 0 0 10px; } table.sets tr.done td:last-child { border-radius: 0 10px 10px 0; }
.si { width: 100% !important; max-width: 5rem; text-align: center; padding: 9px 4px !important; font-size: 16px !important; font-weight: 600; font-variant-numeric: tabular-nums; }
tr.done .si { background: transparent !important; }
.si::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }
.stype { border: 0; background: var(--chalk); border-radius: 8px; width: 30px; height: 30px; font-weight: 700; font-size: 14px; }
tr.done .stype { background: transparent; }
.st-w { color: var(--fat); } .st-d { color: var(--carbs); } .st-f { color: var(--danger); }
.chk { border: 0; background: var(--chalk); width: 38px; height: 34px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.chk svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.chk[aria-pressed="true"] { background: var(--good); color: #fff; }
.add-set { width: 100%; border: 0; background: var(--chalk); border-radius: 10px; padding: 10px; font-weight: 600; font-size: 15px; color: var(--ink); }
.prb { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: #fff; background: var(--fat); border-radius: 5px; padding: 1px 5px; vertical-align: 1px; }
.prb { display: inline-flex; align-items: center; gap: 2px; }
.prb svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pr-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; text-align: left; font-size: 14px; }
.pr-row strong { display: block; font-size: 14.5px; }
.pr-row span { color: var(--muted); font-size: 13px; }
.pr-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--fat) 18%, var(--card)); color: var(--fat); }
.pr-ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pr-list { display: grid; gap: 2px; }
.pr-toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(520px, calc(100% - 24px)); z-index: 25; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.25); }
.pr-toast strong { display: block; font-size: 15px; }
.pr-toast span { font-size: 13px; color: var(--muted); }
.pr-toast.go { animation: prtoast 3.2s ease forwards; }
@keyframes prtoast { 0% { opacity: 0; transform: translate(-50%, -16px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -16px); } }
.vs { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.vs.up, .up { color: var(--good); } .vs.down, .down { color: var(--warn); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 0; justify-items: center; text-align: center; }
.cal b { font-size: 11.5px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cd { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; border: 0; background: none; color: var(--ink); padding: 0; }
.cd.future { color: var(--muted); opacity: 0.5; }
.cd.gym { background: var(--primary); color: var(--primary-ink); font-weight: 700; }
.cd.today { box-shadow: inset 0 0 0 2px var(--primary); }
.cd.gym.today { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary); }
.cal-nav { width: 36px; height: 32px; border: 0; border-radius: 10px; background: var(--chalk); color: var(--primary); font-size: 18px; }
.cal-nav:disabled { opacity: 0.3; }
.cal-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; border-top: 1px solid var(--line); padding-top: 12px; }
.cal-stats b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.cal-stats span { font-size: 12px; color: var(--muted); }
.overload { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.overload strong { display: block; }
.overload span { font-size: 13px; color: var(--muted); }
.ov-ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--chalk) 0); position: relative; }
.ov-ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--card); }
.ov-ring b { position: relative; font-size: 15px; font-variant-numeric: tabular-nums; }
.restbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: min(536px, calc(100% - 16px)); display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 6px; background: var(--card); color: var(--ink); padding: 8px 8px 12px 14px; border-radius: 16px; z-index: 6; box-shadow: 0 6px 28px rgba(0,0,0,0.22); overflow: hidden; }
.restbar .rb-main { background: none; border: 0; padding: 0; text-align: left; display: flex; align-items: baseline; gap: 8px; color: inherit; }
.restbar .rb-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.restbar strong { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; color: var(--primary); }
.restbar button[data-rest="-15"], .restbar button[data-rest="15"] { border: 0; background: var(--chalk); color: var(--ink); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-weight: 600; }
.restbar .rb-skip { border: 0; background: var(--primary); color: var(--primary-ink); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; }
.restbar .rt-track { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--chalk); }
.restbar .rt-track b { display: block; height: 100%; background: var(--primary); transition: width 0.25s linear; }
body.resting { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.restfull { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto auto auto; justify-items: center; gap: 18px; padding: calc(12px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px)); }
.restfull .rf-top { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.restfull .rf-min { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; }
.restfull .rf-min svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.restfull .rf-ring { position: relative; width: min(78vw, 300px); aspect-ratio: 1; align-self: center; }
.restfull .rf-ring svg { width: 100%; height: 100%; }
.restfull .rf-bg { fill: none; stroke: var(--chalk); stroke-width: 12; }
.restfull .rf-fg { fill: none; stroke: var(--primary); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
.restfull .rf-mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.restfull .rf-mid strong { font-size: 4.2rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.restfull .rf-mid span { color: var(--muted); font-size: 15px; margin-top: 6px; }
.restfull .rf-next { margin: 0; color: var(--muted); text-align: center; font-size: 15px; min-height: 1.4em; }
.restfull .rf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; }
.restfull .rf-btns button { border: 0; background: var(--card); color: var(--ink); border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 600; }
.restfull .rf-skip { width: 100%; max-width: 420px; border: 0; background: var(--primary); color: var(--primary-ink); border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; }
.restflash { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; gap: 8px; text-align: center; background: var(--primary); color: var(--primary-ink); }
.restflash strong { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; }
.restflash span { opacity: 0.8; font-size: 14px; }
.restflash.go { animation: restflash 3.5s ease-out forwards; }
@keyframes restflash { 0%, 8%, 16% { opacity: 1; } 4%, 12% { opacity: 0.55; } 75% { opacity: 1; } 100% { opacity: 0; } }
.result.pick.on { background: var(--primary-soft); }
.result .tick { font-weight: 700; color: var(--primary); align-self: center; font-size: 18px; }
.rt-row { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
.mbars { display: grid; gap: 8px; }
.mbar { display: grid; grid-template-columns: 88px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 13.5px; }
.mbar .track { position: relative; overflow: visible; }
.mbar .track i { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--muted); opacity: 0.6; }
.mbar .num { text-align: right; }
.ph-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ph { border: 0; padding: 0; background: var(--chalk); border-radius: 12px; overflow: hidden; display: grid; text-align: left; }
.ph img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--chalk); }
.ph span { font-size: 11.5px; padding: 5px 7px; color: var(--muted); }
.ph-empty { aspect-ratio: 3/4; display: grid; place-items: center; background: var(--chalk); color: var(--muted); font-size: 13px; border-radius: 12px; }
.cmp { display: grid; gap: 10px; }
.cmp-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cmp-pair figure { margin: 0; display: grid; gap: 5px; }
.cmp-pair img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; background: var(--chalk); }
.cmp-pair figcaption { font-size: 12.5px; text-align: center; color: var(--muted); }

/* ---------- Marble theme ---------- */
body { font-family: var(--font-body); letter-spacing: 0.005em; padding-block: 0 calc(118px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg) var(--marble) center / cover no-repeat; pointer-events: none; }
.app { gap: 16px; }
header.bar { padding-block: 22px 6px; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.9rem; letter-spacing: -0.01em; line-height: 0.95; }
.brand small { font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 8px; }
.store { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; letter-spacing: 0; line-height: 1.1; }
h3 { font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); }
.card { background: color-mix(in srgb, var(--card) 80%, transparent); -webkit-backdrop-filter: blur(18px) saturate(115%); backdrop-filter: blur(18px) saturate(115%); border: 1px solid color-mix(in srgb, var(--line) 75%, transparent); box-shadow: var(--shadow); padding: 20px; gap: 14px; }
.btn { border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
.btn.small { border-radius: 999px; padding: 8px 15px; font-size: 13.5px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.link { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 1px; text-underline-offset: 4px; }
input:not([type]), input[type="number"], input[type="text"], input[type="search"], input[type="date"], select, textarea { background: color-mix(in srgb, var(--chalk) 85%, transparent); border-radius: 14px; }
label.field > span { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.seg button, .chips button { background: transparent; box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.seg button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--primary-ink); box-shadow: none; }
.pill { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* Big numbers wear the serif */
.left .big { font-family: var(--font-display); font-weight: 600; font-size: 4.2rem; letter-spacing: -0.02em; line-height: 0.85; font-variant-numeric: lining-nums tabular-nums; }
.left .muted { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.stat .k, .ci span, .wk-stats span, .cal-stats span, .preview span { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.stat .v, .ci b, .wk-stats b, .cal-stats b, .preview b { font-family: var(--font-display); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.stat .v { font-size: 2rem; }
.preview div, .ci div { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; }
.preview b { font-size: 1.7rem; }
.track { height: 4px; }
.macro { font-size: 13.5px; }
.macro .name i { width: 6px; height: 6px; }

/* Today */
.nu-ic { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--accent); }
.nu-ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nu-txt strong { font-weight: 600; }
.wchip { background: transparent; box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.wchip.on { background: var(--good-soft); box-shadow: none; }
.wd i { width: 24px; height: 24px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.wd.great i { background: var(--ink); box-shadow: none; }
.wd.good i { background: color-mix(in srgb, var(--ink) 35%, transparent); box-shadow: none; }
.wd.miss i { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 60%, transparent); }
.wd.future i { border: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); }
.wd.today i { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }
.wd.today span { color: var(--accent); }
.good-t { color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; }
.chip-btn { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.chip-btn.ghost { color: var(--muted); }
.banner { background: var(--ink); color: var(--primary-ink); border-radius: var(--radius); padding: 16px 20px; }
.banner strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.entry { border-top-color: color-mix(in srgb, var(--line) 80%, transparent); }
.meal-head h3 { letter-spacing: 0.18em; }
.daynav h2 { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.daynav button { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); border-radius: 999px; }
details.more summary { color: var(--muted); font-size: 12.5px; letter-spacing: 0.02em; }

/* Tab bar: a floating glass dock */
nav.tabs { left: 14px; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 8px 10px; border-radius: 30px; border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); background: color-mix(in srgb, var(--card) 72%, transparent); box-shadow: 0 12px 40px rgba(0,0,0,0.12); max-width: 520px; margin: 0 auto; }
nav.tabs button { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); position: relative; padding: 4px 2px 6px; }
nav.tabs svg { stroke-width: 1.5; width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"]::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }

/* Sheets */
dialog { border-radius: 28px 28px 0 0; background: var(--card); }
dialog::backdrop { background: rgba(10,10,10,0.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.qa { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 18px; font-weight: 600; }
.qa svg { stroke: var(--ink); stroke-width: 1.5; }
.result { border-bottom-color: color-mix(in srgb, var(--line) 80%, transparent); }
.tag { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; }
.choice { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 18px; }
.status { background: color-mix(in srgb, var(--card) 85%, transparent); box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; }

/* Workout */
.wk-name { font-family: var(--font-display); font-size: 1.7rem !important; font-weight: 600; }
.exname { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; color: var(--ink); }
.ex-menu { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); border-radius: 999px; }
.rest-btn { color: var(--ink); font-weight: 600; font-size: 13px; }
.hint { color: var(--accent); font-size: 13px; }
.stype { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; }
.chk { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; }
.chk[aria-pressed="true"] { background: var(--ink); color: var(--primary-ink); box-shadow: none; }
table.sets tr.done td { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.add-set { background: transparent; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; font-weight: 600; }
.prb { background: var(--accent); border-radius: 999px; padding: 1px 6px; }
.pr-ic { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="commonfoods.js"></script>
<script src="nutrition.js"></script>
<script src="exercises.js"></script>
<script src="workouts.js"></script>
<script src="train.js"></script>
